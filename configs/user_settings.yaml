# Optional user overrides for optimization runs.
# Edit values here; unspecified values continue to come from the selected scenario YAML.
optimization:
  min_open_stations: 3
  max_open_stations: 10
  min_chargers_per_station: 2
  max_chargers_per_station: 12
  # Upfront CAPEX cap in BDT (land + charger equipment + installation + grid connection).
  budget_cap_bdt: 2500000000
  # Maximum network-distance service radius used by the optimizer (meters).
  service_radius_rmax_m: 5000.0
  nsga2:
    population_size: 100
    generations: 250
    crossover_probability: 0.85
    mutation_probability: 0.15
    random_seed: 42

# Optional overrides: uncomment only the values you want to change.
