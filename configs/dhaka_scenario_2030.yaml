# Optimal EVCS Placement Configuration for Dhaka (2030 High-Adoption Target Scenario)

project:
  name: "dhaka-evcs-2030-target"
  study_area: "Dhaka Metropolitan Area (DNCC & DSCC)"
  base_year: 2026
  target_year: 2030
  crs_geographic: "EPSG:4326"
  crs_projected: "EPSG:32646"

spatial:
  grid_resolution_meters: 100
  bounding_box:
    min_lon: 90.3200
    max_lon: 90.4600
    min_lat: 23.6800
    max_lat: 23.9000
  exclusion_buffers:
    waterbodies_m: 30.0
    heritage_sites_m: 50.0
    flood_hazard_threshold: 0.7
  candidate_site_generation:
    min_suitability_score: 0.40
    min_spacing_m: 300.0
    max_candidate_sites: 65

ahp_mcdm:
  criteria:
    traffic_density:
      weight: 0.22
      preference: "max"
      description: "Proximity to primary and secondary arterial road corridors"
    poi_density:
      weight: 0.18
      preference: "max"
      description: "Proximity to commercial, educational, and business activity clusters"
    parking_availability:
      weight: 0.16
      preference: "max"
      description: "Co-location feasibility with existing parking lots & fuel stations"
    substation_proximity:
      weight: 0.15
      preference: "min_distance"
      description: "Distance to 33/11kV DPDC & DESCO substations"
    substation_headroom:
      weight: 0.12
      preference: "max"
      description: "Available spare transformer capacity at nearest substation"
    land_value_index:
      weight: 0.09
      preference: "min_cost"
      description: "Land acquisition / rental expenditure minimization"
    flood_inundation_risk:
      weight: 0.08
      preference: "min_risk"
      description: "Exclusion of monsoon waterlogging and flood vulnerability zones"
  pairwise_matrix:
    - [1.000, 1.250, 1.400, 1.500, 1.850, 2.450, 2.750]
    - [0.800, 1.000, 1.150, 1.250, 1.500, 2.000, 2.250]
    - [0.714, 0.870, 1.000, 1.100, 1.350, 1.800, 2.000]
    - [0.667, 0.800, 0.909, 1.000, 1.250, 1.650, 1.850]
    - [0.541, 0.667, 0.741, 0.800, 1.000, 1.350, 1.500]
    - [0.408, 0.500, 0.556, 0.606, 0.741, 1.000, 1.150]
    - [0.364, 0.444, 0.500, 0.541, 0.667, 0.870, 1.000]

economic:
  discount_rate: 0.08
  project_lifetime_years: 10
  vot_bdt_per_hour: 280.0
  alpha_delay_weight: 0.65
  currency_usd_to_bdt: 115.0
  land_acquisition_base_sqm: 150.0
  land_sqm_per_charger: 30.0
  land_costs_bdt_per_sqm:
    Gulshan_Banani: 280000.0
    Motijheel_Dilkusha: 240000.0
    Dhanmondi: 200000.0
    Kawran_Bazar_Tejgaon: 170000.0
    Badda_Mohakhali: 160000.0
    Old_Dhaka: 140000.0
    Uttara: 130000.0
    Mirpur: 110000.0
    Jatrabari_Sayedabad: 95000.0
    Purbachal_Suburbs: 65000.0
    Default_Zone: 120000.0
  grid_connection_cost_per_kw: 4200.0
  grid_distance_penalty_bdt_per_m: 1100.0

