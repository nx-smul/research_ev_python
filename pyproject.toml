[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-evcs"
version = "0.1.0"
description = "Optimal Electric Vehicle (EV) Charging Station Placement in Dhaka Metropolitan Area"
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chowdhury, S. M." },
    { name = "Khan, N." },
    { name = "Rahman, M. T." },
    { name = "Ahmed, F." }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
spatial = [
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "networkx>=3.0"
]
grid = [
    "pandapower>=2.13.0"
]
optimization = [
    "deap>=1.3.3",
    "pyomo>=6.6.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]
all = [
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "networkx>=3.0",
    "pandapower>=2.13.0",
    "deap>=1.3.3",
    "pyomo>=6.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
dhaka-evcs = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["api*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
